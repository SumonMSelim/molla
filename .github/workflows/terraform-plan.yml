name: Terraform plan

# Read-only: assumes the plan-only OIDC role and posts the plan diff as a PR
# comment. Never applies. Real apply is deploy.yml, gated by a tag push or a
# manual dispatch through the production environment.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "infra/terraform/aws/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: tf-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_DIR: infra/terraform/aws/envs/prod

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-plan
    steps:
      - uses: actions/checkout@v7

      # The Lambda modules hash the zips at plan time, so the plan builds them
      # exactly as deploy.yml does; the diff then covers code changes too.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"

      # Public claims only (never the token itself): makes an OIDC trust
      # mismatch diagnosable from the run log instead of a bare 403.
      - name: Show OIDC token claims
        run: |
          token="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          payload="$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')"
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          printf '%s%s' "$payload" "$(printf '=%.0s' $(seq 1 $pad))" | base64 -d | jq '{sub, aud, repository, environment, ref, event_name}'

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build Lambda zips
        run: make build-lambda GO=go

      - name: Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      # shell: bash turns on pipefail, so the tee below cannot mask terraform's
      # exit code and turn a failed plan into a green check. -lock=false: the
      # plan role is read-only by design and has no write access to the lock
      # table; a plan never writes state, so it has nothing to protect.
      - name: Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform plan -no-color -input=false -lock=false \
            -var "artifact_dir=${{ github.workspace }}/dist" \
            -var 'admin_principal_arns=${{ vars.ADMIN_PRINCIPAL_ARNS }}' \
            -var "alarm_email=${{ vars.ALARM_EMAIL }}" \
            -var "domain_name=${{ vars.DOMAIN_NAME }}" \
            -var "cloudflare_zone_id=${{ vars.CLOUDFLARE_ZONE_ID }}" \
            -var "github_repository=${{ github.repository }}" \
            -out=tfplan | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const plan = fs.readFileSync('${{ env.TF_DIR }}/plan.txt', 'utf8')
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncated)' : plan
            const body = [
              '### Terraform plan (envs/prod)',
              '',
              '```hcl',
              truncated,
              '```',
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            })
            const existing = comments.find(c => c.body.startsWith('### Terraform plan (envs/prod)'))
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body })
            }

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
