name: Terraform plan

# Read-only: plans infra/terraform/cloudflare and posts the diff as a PR
# comment. Never applies. Real apply is deploy.yml, gated by a tag push or a
# manual dispatch through the production environment.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "infra/terraform/cloudflare/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tf-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_DIR: infra/terraform/cloudflare

jobs:
  plan:
    # Dependabot runs cannot read the production-plan secrets, so the plan
    # would only fail. A skipped job still satisfies a required check.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-plan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.2"

      - name: Init
        working-directory: ${{ env.TF_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"

      # shell: bash turns on pipefail, so the tee below cannot mask terraform's
      # exit code and turn a failed plan into a green check.
      - name: Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform plan -no-color -input=false -lock=false \
            -var "account_id=${{ vars.CLOUDFLARE_ACCOUNT_ID }}" \
            -var "zone_id=${{ vars.CLOUDFLARE_ZONE_ID }}" \
            -var "domain_name=${{ vars.DOMAIN_NAME }}" \
            -var "access_team_name=${{ vars.ACCESS_TEAM_NAME }}" \
            -var 'operator_emails=${{ vars.OPERATOR_EMAILS }}' \
            -out=tfplan | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs')
            const plan = fs.readFileSync('${{ env.TF_DIR }}/plan.txt', 'utf8')
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncated)' : plan
            const body = [
              '### Terraform plan (cloudflare)',
              '',
              '```hcl',
              truncated,
              '```',
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            })
            const existing = comments.find(c => c.body.startsWith('### Terraform plan (cloudflare)'))
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body })
            }

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
