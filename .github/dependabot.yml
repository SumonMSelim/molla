version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    ignore:
      # @cloudflare/vitest-pool-workers peers on vitest ^4.1; lift this once
      # a release supports vitest 5.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      # vitest and its coverage provider must move together (peer dependency).
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # react and react-dom must have the exact same version.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
  - package-ecosystem: terraform
    directory: /infra/terraform/cloudflare
    schedule:
      interval: weekly
